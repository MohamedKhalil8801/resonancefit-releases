# End-to-end check of the published release on Windows, macOS and Linux:
# EQ Helper's pipeline downloads the latest release (checksum verified),
# generates a customer package, extracts it like a customer and launches the
# packaged app, which must load the calibration and shipped targets by itself
# (eq-helper: packaging/e2e_check.py). Runs after every publish, or by hand.
name: End-to-end check

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "eq-helper branch, tag or commit with the check script"
        required: true
        default: feat/resonancefit
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

jobs:
  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MohamedKhalil8801/eq-helper
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/pyproject.toml
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: pip install ./src
      - name: Generate a customer from the latest release and launch it
        shell: bash
        working-directory: src
        run: |
          python packaging/e2e_check.py > "$RUNNER_TEMP/e2e.txt" 2>&1; status=$?
          cat "$RUNNER_TEMP/e2e.txt"
          if [ $status -ne 0 ]; then
            msg=$(grep -E "FAILED|NOT|NO;|MISSING|Error|error" "$RUNNER_TEMP/e2e.txt" | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=End-to-end check failed on ${{ matrix.os }}::$msg"
          fi
          exit $status
